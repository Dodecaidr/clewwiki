name: CI

on:
  push:
  pull_request:

# Nothing in this workflow writes to the repository. Each job states what it
# reads; anything not listed is denied.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the release it
# corresponds to in a comment: a tag can be moved to other code, a commit
# cannot. Update both together.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        # Same mirror rule as every other image in this repository.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: clewwiki
          POSTGRES_PASSWORD: clewwiki
          POSTGRES_DB: clewwiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clewwiki -d clewwiki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://clewwiki:clewwiki@localhost:5432/clewwiki_test
      # Build-time placeholders. No real secret is needed to compile, and none
      # is available to a fork's pull request by design.
      DATABASE_URL: postgres://clewwiki:clewwiki@localhost:5432/clewwiki_test
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        # Blocking: a high or critical advisory in the dependency tree fails the
        # build. Advisory data changes without a commit of ours, so a new one can
        # turn an unrelated change red; the fix is an upgrade or a
        # `pnpm.overrides` entry in package.json, not skipping this step.
        run: pnpm audit --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists a pull request's commits through the API to decide
      # what to scan.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the image and brings the stack up exactly as the README tells an
  # operator to, then walks the first-run path over HTTP: setup, sign-in, an
  # agent token, a claim-write-release cycle, both exports and MCP over HTTP.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Build from source rather than pulling ghcr.io/dodecaidr/clewwiki, so
      # this job keeps testing the tree being pushed, not whatever is
      # published. docker-compose.build.yml layers a `build:` section onto
      # the base file's `image:`; every `docker compose` below picks both up
      # from this variable, no `-f` flags needed.
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        # Only the smoke script runs on the runner; the application runs in
        # the container.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Compose refuses to start without the required secrets
        run: |
          set -u
          if docker compose --env-file /dev/null config > /dev/null 2> compose-error.txt; then
            echo "::error::docker compose accepted a configuration with no secrets"
            exit 1
          fi
          cat compose-error.txt
          grep -q 'is required' compose-error.txt

      - name: Write .env with generated secrets
        run: |
          set -eu
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "MCP_HTTP_ENABLED=true"
            # First-run setup needs a one-time token. Without this the instance
            # would generate one and print it to its log, which the smoke test
            # can also read; setting it exercises the configured path.
            echo "CLEWWIKI_SETUP_TOKEN=$(openssl rand -hex 24)"
          } > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test over HTTP
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: |
          set -eu
          SMOKE_SETUP_TOKEN="$(grep '^CLEWWIKI_SETUP_TOKEN=' .env | cut -d= -f2-)" \
            node scripts/smoke-test.mjs

      - name: Inspect the running container
        run: |
          set -eu
          uid="$(docker compose exec -T web id -u)"
          gid="$(docker compose exec -T web id -g)"
          echo "web runs as uid=${uid} gid=${gid}"
          if [ "${uid}" = "0" ] || [ "${gid}" = "0" ]; then
            echo "::error::the web container runs as root"
            exit 1
          fi

          # What the anchor checker and the migrator read at run time.
          docker compose exec -T web git --version
          docker compose exec -T web sh -c '
            set -e
            for f in web-tree-sitter.wasm tree-sitter-typescript.wasm tree-sitter-tsx.wasm tree-sitter-swift.wasm tree-sitter-kotlin.wasm; do
              test -s "/app/grammars/$f"
            done
            test -s /app/migrations/meta/_journal.json
            ls /app/migrations/*.sql
            test -w /data/repos
            test -s /app/LICENSE
            # `set -e` does not act on a negated command, hence the explicit exits.
            if test -w /app/apps/web/server.js; then echo "application code is writable"; exit 1; fi
            if command -v npm > /dev/null; then echo "npm is present in the runtime image"; exit 1; fi
            if command -v pnpm > /dev/null; then echo "pnpm is present in the runtime image"; exit 1; fi
          '

      - name: No secret from .env is recorded in the image
        run: |
          set -eu
          image="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")"
          docker history --no-trunc "${image}" > image-history.txt
          docker image inspect "${image}" > image-config.json
          for key in POSTGRES_PASSWORD BETTER_AUTH_SECRET CLEWWIKI_SETUP_TOKEN; do
            value="$(grep "^${key}=" .env | cut -d= -f2-)"
            if grep -qF -- "${value}" image-history.txt image-config.json; then
              echo "::error::the value of ${key} appears in the image"
              exit 1
            fi
          done
          if grep -q 'build-time-placeholder' image-history.txt image-config.json; then
            echo "::error::a build-time placeholder leaked into the runtime image"
            exit 1
          fi

      - name: Report image size
        run: |
          set -eu
          image="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")"
          bytes="$(docker image inspect --format '{{.Size}}' "${image}")"
          {
            echo "### Container image"
            echo
            echo "| Image | Size |"
            echo "|---|---|"
            echo "| web | $(awk -v b="${bytes}" 'BEGIN { printf "%.1f MB (%d bytes)", b / 1000000, b }') |"
            echo
            echo "<details><summary>Layers</summary>"
            echo
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' "${image}" | cut -c1-160
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env
