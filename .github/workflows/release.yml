name: Release

# Runs on a version tag push (v1.2.3, v1.2.3-beta.1, ...) and can be run by
# hand for a dry run that builds and tests everything without publishing
# anything. Nothing here writes to the repository except the github-release
# job, which creates the GitHub Release for the tag that triggered the run.
#
# Third-party actions are pinned to a full commit SHA, with the release it
# corresponds to in a comment, resolved with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (dereferencing the tag object for an annotated tag). A tag can be moved to
# other code; a commit cannot. Update both together.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only: skip the image push, the npm publish, and the GitHub Release.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.IS_DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is lowercase because GHCR requires it, regardless of the
      # GitHub owner/repo casing.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/dodecaidr/clewwiki
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=clewwiki
            org.opencontainers.image.description=Self-hosted knowledge base where people and coding agents write together: claims instead of silent overwrites, pages anchored to the code they describe, REST and MCP.
            org.opencontainers.image.vendor=Dodecaidr
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.IS_DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest build provenance
        if: env.IS_DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dodecaidr/clewwiki
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm:
    name: Publish the MCP server package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./packages/mcp-server/package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag v${tag_version} does not match packages/mcp-server/package.json version ${pkg_version}"
            exit 1
          fi
          echo "tag version ${tag_version} matches packages/mcp-server/package.json"

      - name: Build @clewwiki/mcp-server
        run: pnpm --filter @clewwiki/mcp-server build

      - name: Test @clewwiki/mcp-server
        run: pnpm --filter @clewwiki/mcp-server test

      - name: Check for NPM_TOKEN
        id: npm_token
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.npm_token.outputs.present == 'true' && env.IS_DRY_RUN != 'true'
        run: pnpm --filter @clewwiki/mcp-server publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped
        if: steps.npm_token.outputs.present != 'true' || env.IS_DRY_RUN == 'true'
        run: |
          if [ "${IS_DRY_RUN}" = "true" ]; then
            echo "::notice::dry run — skipping npm publish"
          else
            echo "::notice::NPM_TOKEN is not set — skipping npm publish. Add the secret to enable it (see docs/roadmap.md, Phase 7)."
          fi

  github-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: [image, npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"
          awk -v ver="${version}" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "::error::no CHANGELOG.md section found for [${version}] — add one before tagging"
            exit 1
          fi
          {
            echo "notes_file=${notes_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prerelease_flag=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            ${prerelease_flag}
