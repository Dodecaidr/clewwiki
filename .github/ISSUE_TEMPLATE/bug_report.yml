name: Bug report
description: Report a problem with clewwiki (the application, the MCP server, or the Docker image).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a **security
        vulnerability**, do not use this form — use
        [private vulnerability reporting](https://github.com/Dodecaidr/clewwiki/security/advisories/new)
        instead. See `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >
        The clewwiki release tag, or the commit SHA if you are running from
        a checkout (`git rev-parse HEAD`).
      placeholder: v0.7.0, or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (published image)
        - Docker Compose (built from source)
        - Source checkout (pnpm dev / pnpm start)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: agent-host
    attributes:
      label: Agent host (MCP issues only)
      description: >
        If this is about the MCP server, name the agent host you used —
        Claude Code, Cursor, Codex, or another MCP client — and whether it
        ran over stdio or the streamable HTTP transport. Leave blank if this
        is not an MCP issue.
      placeholder: e.g. Claude Code over stdio
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the problem, in order.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        `docker compose logs web`, browser console output, or MCP client
        logs. **Redact agent tokens, session cookies, and passwords before
        pasting** — a token looks like `cww_...`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (OS, browser, reverse proxy in front of the instance, etc.).
    validations:
      required: false
